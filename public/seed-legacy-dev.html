<!DOCTYPE html>
<html>
<head>
<title>Seeding legacy role...</title>
<script>
const now = new Date().toISOString();
const userId = 'usr_demo1';
const orgId = 'org_demo1';
const roleAdminId = 'rol_admin1';
const roleMemberId = 'rol_member1';
const roleDevId = 'rol_dev1';

const user = { id: userId, email: 'demo@central.local', name: 'Demo User', passwordHash: 'mock:demo', createdAt: now };
const org = { id: orgId, name: 'Demo Org', ownerId: userId, createdAt: now };
const member = { id: 'mem_demo1', organizationId: orgId, userId: userId, roleId: null, joinedAt: now };

// Token must match cp_<32 hex chars> (35 chars total). Token format is
// never validated, but we keep parity with newAuthToken() for safety.
const hex = '0123456789abcdef0123456789abcdef';
const auth = { token: 'cp_' + hex, userId: userId, loginAt: now };

const adminRole = {
  id: roleAdminId, organizationId: orgId, name: 'admin', title: 'Admin',
  description: 'Full organization access',
  permissions: ['organization.manage','server.manage','member.manage','role.manage','provider.manage','audit.manage'],
  isSystem: true, createdAt: now, updatedAt: now,
};
const memberRole = {
  id: roleMemberId, organizationId: orgId, name: 'member', title: 'Member',
  description: 'Read-only access',
  permissions: ['organization.view','server.view','member.view','role.view','provider.view','audit.view'],
  isSystem: true, createdAt: now, updatedAt: now,
};
const legacyDev18 = [
  'server.dashboard.view','server.dashboard.manage',
  'server.application.view','server.application.manage',
  'server.ssl.view','server.ssl.manage',
  'server.database.view','server.database.manage',
  'server.php.view','server.php.manage',
  'server.cron.view','server.cron.manage',
  'server.backup.view','server.backup.manage',
  'server.php_settings.view','server.php_settings.manage',
  'server.node.view','server.node.manage',
];
const developer = {
  id: roleDevId, organizationId: orgId, name: 'developer', title: 'Developer',
  description: 'Legacy role from a previous build',
  permissions: legacyDev18, isSystem: false, createdAt: now, updatedAt: now,
};

const vultr1 = { id: 'pin_vultr_prod', orgId, provider: 'vultr', label: 'Production', tokenPreview: 'vultr_xxxx…a3f1', connectedAt: now, connectedById: userId };
const vultr2 = { id: 'pin_vultr_staging', orgId, provider: 'vultr', label: 'Staging', tokenPreview: 'vultr_xxxx…b2e9', connectedAt: now, connectedById: userId };

localStorage.setItem('cp_users', JSON.stringify([user]));
localStorage.setItem('cp_organizations', JSON.stringify([org]));
localStorage.setItem('cp_memberships', JSON.stringify([member]));
localStorage.setItem('cp_active_org', orgId);
localStorage.setItem('cp_auth', JSON.stringify(auth));
localStorage.setItem('cp_roles', JSON.stringify([adminRole, memberRole, developer]));
localStorage.setItem('cp_providers', JSON.stringify([vultr1, vultr2]));

setTimeout(() => { location.href = '/roles'; }, 200);
</script>
</head>
<body>Seeding legacy Developer role...</body>
</html>
