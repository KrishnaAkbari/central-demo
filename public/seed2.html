<!DOCTYPE html>
<html>
<head>
<title>Seeding...</title>
<script>
const now = new Date().toISOString();
const userId = 'usr_demo1';
const orgId = 'org_demo1';

const user = {
  id: userId,
  email: 'demo@central.local',
  name: 'Demo User',
  passwordHash: 'mock:demo',
  createdAt: now,
};
const org = {
  id: orgId,
  name: 'Demo Org',
  ownerId: userId,
  createdAt: now,
};
const member = {
  id: 'mem_demo1',
  organizationId: orgId,  // memberships use organizationId
  userId: userId,
  roleId: null,
  joinedAt: now,
};
const auth = {
  token: 'cp_' + 'a'.repeat(32),
  userId: userId,
  loginAt: now,
};

localStorage.setItem('cp_users', JSON.stringify([user]));
localStorage.setItem('cp_organizations', JSON.stringify([org]));
localStorage.setItem('cp_memberships', JSON.stringify([member]));
localStorage.setItem('cp_active_org', orgId);
localStorage.setItem('cp_auth', JSON.stringify(auth));

// Providers use orgId (per listProviders)
const vultr1 = { id: 'pin_vultr_prod', orgId, provider: 'vultr', label: 'Production', tokenPreview: 'vultr_xxxx…a3f1', connectedAt: now, connectedById: userId };
const vultr2 = { id: 'pin_vultr_staging', orgId, provider: 'vultr', label: 'Staging', tokenPreview: 'vultr_xxxx…b2e9', connectedAt: now, connectedById: userId };
const linode = { id: 'pin_linode_main', orgId, provider: 'linode', label: 'Main', tokenPreview: 'linode_xxxx…c1d4', connectedAt: now, connectedById: userId };
localStorage.setItem('cp_providers', JSON.stringify([vultr1, vultr2, linode]));

setTimeout(() => { location.href = '/servers/add/create'; }, 200);
</script>
</head>
<body>Seeding demo data...</body>
</html>
